# Publica as migracoes do banco (supabase/migrations/) num projeto do Supabase.
#
#  - Ambiente de TESTE: automatico a cada merge na main que muda uma migracao,
#    ou manual (Actions -> publicar-banco -> Run workflow).
#  - Ambiente de PRODUCAO: so manual, escolhendo "producao". Configure o
#    ambiente "producao" no GitHub com aprovacao obrigatoria (Settings ->
#    Environments -> producao -> Required reviewers).
#
# Cada ambiente do GitHub (Settings -> Environments) precisa de:
#   - variavel SUPABASE_PROJECT_ID: o "ref" do projeto (nao e segredo);
#   - segredo  SUPABASE_DB_PASSWORD: a senha do banco desse projeto.
# E o repositorio precisa do segredo SUPABASE_ACCESS_TOKEN (token pessoal do
# Supabase: Account -> Access Tokens). Passo a passo em docs/AMBIENTES.md.
#
# So aplica migracoes novas: o que ja foi aplicado nunca roda de novo, e
# migracao aplicada nunca e editada (cria-se outra).
name: publicar-banco

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Onde publicar"
        type: choice
        options: [teste, producao]
        default: teste
      dados_de_exemplo:
        description: "Carregar os dados de exemplo (so no teste e com o banco vazio)"
        type: boolean
        default: false

# Nunca duas publicacoes no mesmo ambiente ao mesmo tempo.
concurrency:
  group: publicar-banco-${{ inputs.ambiente || 'teste' }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente || 'teste' }}
    env:
      AMBIENTE: ${{ inputs.ambiente || 'teste' }}
      DADOS_DE_EXEMPLO: ${{ inputs.dados_de_exemplo || false }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Conferir a configuracao
        run: |
          faltando=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && faltando="$faltando SUPABASE_ACCESS_TOKEN(segredo do repositorio)"
          [ -z "$SUPABASE_DB_PASSWORD" ] && faltando="$faltando SUPABASE_DB_PASSWORD(segredo do ambiente $AMBIENTE)"
          [ -z "$SUPABASE_PROJECT_ID" ] && faltando="$faltando SUPABASE_PROJECT_ID(variavel do ambiente $AMBIENTE)"
          if [ -n "$faltando" ]; then
            echo "::error::Falta configurar no GitHub:$faltando. Veja docs/AMBIENTES.md."
            exit 1
          fi
          if [ "$AMBIENTE" = "producao" ] && [ "$DADOS_DE_EXEMPLO" = "true" ]; then
            echo "::error::Dados de exemplo nunca vao para a producao."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Ligar ao projeto do Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Mostrar o que vai ser aplicado
        run: supabase db push --dry-run

      - name: Aplicar as migracoes
        if: env.DADOS_DE_EXEMPLO != 'true'
        run: supabase db push

      # Dados de exemplo: gerados na hora (datas ancoradas no dia de hoje).
      - uses: actions/setup-node@v4
        if: env.DADOS_DE_EXEMPLO == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Aplicar as migracoes e carregar os dados de exemplo
        if: env.DADOS_DE_EXEMPLO == 'true'
        run: |
          npm ci
          npm run banco:seed
          supabase db push --include-seed
